<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect width="32" height="32" rx="8" fill="currentColor" class="bg"/>
  <!-- The Three Rays of Awen -->
  <line x1="10" y1="24" x2="13" y2="8" stroke="currentColor" class="fg" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="16" y2="7" stroke="currentColor" class="fg" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="22" y1="24" x2="19" y2="8" stroke="currentColor" class="fg" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="12" cy="6" r="1.2" fill="currentColor" class="fg"/>
  <circle cx="16" cy="5" r="1.2" fill="currentColor" class="fg"/>
  <circle cx="20" cy="6" r="1.2" fill="currentColor" class="fg"/>
  <style>
    .bg { fill: #121214; }
    .fg { stroke: #f5f5f7; fill: #f5f5f7; }
