<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} — Awen{{ else }}Awen — Inquiries into Politics, Technology &amp; History{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}A monochromatic publication exploring politics, technology, history, and the ideas shaping our collective future.{{ end }}">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate" type="application/rss+xml" title="Awen Feed" href="/feed.xml">
  <link rel="stylesheet" href="/css/style.css">
  
  <!-- Zero-FOUC Theme Initialization -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('awen-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="Awen Home">
        <svg class="brand-symbol" viewBox="0 0 32 32">
          <line x1="9" y1="25" x2="13" y2="7" stroke="currentColor" stroke-linecap="round"/>
          <line x1="16" y1="25" x2="16" y2="6" stroke="currentColor" stroke-linecap="round"/>
          <line x1="23" y1="25" x2="19" y2="7" stroke="currentColor" stroke-linecap="round"/>
          <circle cx="12.5" cy="5" r="1.3" fill="currentColor"/>
          <circle cx="16" cy="4" r="1.3" fill="currentColor"/>
          <circle cx="19.5" cy="5" r="1.3" fill="currentColor"/>
        </svg>
        <span>Awen</span>
      </a>

      <nav class="site-nav">
        <a href="/" {{ if eq .ActiveNav "essays" }}class="active"{{ end }}>Essays</a>
        <a href="/about/" {{ if eq .ActiveNav "about" }}class="active"{{ end }}>About</a>
        <a href="/feed.xml" target="_blank" rel="noopener">RSS</a>
      </nav>

      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    {{ .Content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span>Awen &copy; 2026</span>
        <span class="meta-dot">·</span>
        <span>Dedicated to sovereign thought, history &amp; critical inquiry</span>
      </div>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/feed.xml">RSS Feed</a>
        <a href="#top">Back to Top &uarr;</a>
      </div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
